schema_version: p1p2.method-registry.v1
registry_version: 1
status: frozen_protocol_registry

source_of_truth:
  p2_config: config/experiment_config.json
  p2_config_version: v2
  note: >-
    B2/B3/B4/B5 retain their existing P2 definitions and implementations.
    This registry identifies dispatch and integration metadata only; it does
    not redefine or override the frozen P2 experiment configuration.

registered_seeds:
  - 13
  - 42
  - 2026
custom_seed_policy:
  enabled: true
  namespace_suffix: custom
  registered_namespace: p1p2_integration
  custom_namespace: p1p2_integration_custom
  registered_seed_values_are_reserved: true

checkpoint_protocol:
  baseline: S0
  rounds:
    1: S1
    2: S2
    3: S3
  total_rounds: 3
  p2_round_index_offset: -1
  evaluation_split: dev
  test_evaluation_during_rounds: false

methods:
  B2:
    enabled: true
    family: p2_baseline
    implementation: existing_p2
    source_config: config/experiment_config.json
    selection_policy: frozen_p2_b2
    requires_capability_state: false
    requires_nll: false
    graph_evidence_required: false
    output_method_id: B2

  B3:
    enabled: true
    family: p2_baseline
    implementation: existing_p2
    source_config: config/experiment_config.json
    selection_policy: frozen_p2_b3
    requires_capability_state: false
    requires_nll: false
    graph_evidence_required: false
    output_method_id: B3

  B4:
    enabled: true
    family: p2_baseline
    implementation: existing_p2
    source_config: config/experiment_config.json
    selection_policy: frozen_p2_b4
    requires_capability_state: false
    requires_nll: true
    nll_checkpoint_policy: S0
    graph_evidence_required: false
    output_method_id: B4
    shared_checkpoint_alias:
      alias_group: B4_B5_seed_scoped_S1
      canonical_method: B5
      checkpoint: S1

  B5:
    enabled: true
    family: p2_baseline
    implementation: existing_p2
    source_config: config/experiment_config.json
    selection_policy: frozen_p2_b5
    requires_capability_state: false
    requires_nll: true
    nll_checkpoint_policy: current_checkpoint
    graph_evidence_required: false
    output_method_id: B5
    shared_checkpoint_alias:
      alias_group: B4_B5_seed_scoped_S1
      canonical_method: B5
      checkpoint: S1

  P1-DEFICIT:
    enabled: true
    family: p1_baseline
    implementation: p1p2_selector
    selection_policy: capability_deficit_only
    requires_capability_state: true
    requires_nll: false
    graph_evidence_required: false
    output_method_id: P1-DEFICIT

  P1P2:
    enabled: true
    family: integrated_method
    implementation: p1p2_selector
    selection_policy: capability_deficit_plus_dynamic_learnability
    requires_capability_state: true
    requires_nll: true
    nll_checkpoint_policy: current_checkpoint_each_round
    priority_policy:
      policy_id: p1p2_alpha_050_v1
      alpha: 0.5
      alpha_tuned: false
      formula: alpha * p1_deficit + (1 - alpha) * percentile_rank_l_proxy
    graph_evidence_required: false
    output_method_id: P1P2

  P1-GRAPH:
    enabled: false
    status: NOT_RUN_NOT_APPLICABLE_PENDING_GRAPH_EVIDENCE
    family: graph_guided_method
    implementation: not_configured
    selection_policy: unsupported_until_graph_evidence_passes
    requires_capability_state: true
    requires_nll: false
    graph_evidence_required: true
    output_method_id: P1-GRAPH
    enablement_requirements:
      - graph_edges_have_evidence_references
      - graph_edges_have_source_hashes
      - annotation_and_probe_completion_is_verified
      - edge_thresholds_are_evaluated

output_namespaces:
  registered:
    runs: runs/p1p2_integration
    models: models/p1p2_integration
    reports: reports/p1p2_integration
  custom:
    runs: runs/p1p2_integration_custom
    models: models/p1p2_integration_custom
    reports: reports/p1p2_integration_custom
  forbidden:
    - runs/main
